[workspace]
members = [
    "crates/app",
    "crates/snemcore",
    "crates/devtools",
]
resolver = "2"

[workspace.dependencies]
anyhow     = "1.0.102"
rfd        = "0.17.2"
env_logger = "0.11.9"
log        = "0.4.29"
egui       = { version = "0.33.3", features = ["serde"] }
egui_glow  = "0.33.3"
egui_extras = { version = "0.33.3", features = ["svg"] }
glow       = "0.16.0"
sdl3 = {version = "0.17.3", features = ["build-from-source"]}

[profile.dev]
overflow-checks = false
opt-level = 2
debug = 2

[profile.release]
overflow-checks = false
opt-level = 3
lto = true
