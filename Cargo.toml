[workspace]
members = [
    "crates/snemulator",
    "crates/snemcore",
    "crates/devtools",
]
resolver = "2"

[workspace.dependencies]
anyhow     = "1.0.102"
rfd        = "0.17.2"
env_logger = "0.11.9"
log        = "0.4.29"
crc32fast  = "1.5.0"
egui_glow  = "0.35.0"
egui       = { version = "0.35.0", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["svg", "file", "image"] }
glow       = "0.17.0"
sdl3 = {version = "0.17.3", features = ["build-from-source", "image"]}
serde = {version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
image = { version = "0.25.10", features = ["png"] }

[profile.dev]
overflow-checks = false
opt-level = 2
debug = 2

[profile.release]
overflow-checks = false
opt-level = 3
lto = true

[profile.release.package.devtools]
debug = true
strip = false